repos:
  - repo: local
    hooks:
      - id: black
        name: Black
        stages: [pre-commit]
        language: system
        entry: black
        types: [python]

      - id: pylint
        name: PyLint
        stages: [pre-commit]
        language: system
        entry: pylint --rcfile=.pylintrc
        files: \.py$
